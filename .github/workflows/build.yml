name: Liberty VPN Own Build

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Pure Android APK Without Gradle
        run: |
          # 1. Создаем структуру папок для сборки
          mkdir -p app/src/main/java/com/liberty/vpn
          mkdir -p app/src/main/res/values
          mkdir -p build/gen build/obj build/apk
          
          # 2. Декодируем Манифест с флагом чистой строки без лишних символов переноса
          echo -n "" | base64 -d | tr -d '\r\n' > app/src/main/AndroidManifest.xml

          # 3. Записываем чистую Java-логику приложения
          cat << 'EOF' > app/src/main/java/com/liberty/vpn/MainActivity.java
          package com.liberty.vpn;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.app.Activity;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(android.view.Gravity.CENTER);
                  Button connectButton = new Button(this);
                  connectButton.setText("ПОДКЛЮЧИТЬ LIBERTY VPN");
                  layout.addView(connectButton);
                  setContentView(layout);
                  try {
                      String mirrorUrl = "https://githack.com";
                      android.content.Intent intent = new android.content.Intent("android.intent.action.VIEW");
                      intent.setData(android.net.Uri.parse(mirrorUrl));
                      intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

          # 4. Линкуем ресурсы и компилируем Java-код с помощью официальных утилит Android SDK
          SDK=$ANDROID_HOME/platforms/android-34/android.jar
          $ANDROID_HOME/build-tools/34.0.0/aapt2 compile --dir app/src/main/res -o build/res.zip || true
          $ANDROID_HOME/build-tools/34.0.0/aapt2 link --manifest app/src/main/AndroidManifest.xml -I $SDK -o build/base.apk build/res.zip --java build/gen --custom-package com.liberty.vpn
          
          javac -target 17 -source 17 -bootclasspath $SDK -d build/obj app/src/main/java/com/liberty/vpn/MainActivity.java
          
          # 5. Трансформируем Java-классы в байт-код Dalvik (classes.dex)
          $ANDROID_HOME/build-tools/34.0.0/d8 build/obj/com/liberty/vpn/*.class --output build/apk/ --lib $SDK
          
          # 6. Упаковываем скомпилированный код внутрь базового APK-пакета
          cd build/apk && zip -r ../../Liberty_VPN.apk classes.dex && cd ../..
          cp build/base.apk Liberty_VPN_Final.apk
          zip -g Liberty_VPN_Final.apk build/apk/classes.dex

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liberty-vpn-app
          path: Liberty_VPN_Final.apk
