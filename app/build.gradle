plugins {
    id 'com.android.application'
}

// Явно говорим компилятору модуля app искать библиотеки в Google
repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.liberty.vpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.liberty.vpn"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
